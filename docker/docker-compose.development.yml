# Development stack. Run via `pnpm docker:development:*` (passes --env-file env/.env.development).
# Paths are relative to this file (docker/).
name: raftlabs-development

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../env/.env.development
    environment:
      - PGPORT=${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      # postgres 18+ keeps PGDATA under a versioned dir inside /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:?REDIS_PORT must be set in env/.env.development}"]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created by the worker at startup (partitions come from KAFKA_PARTITIONS).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Single broker: internal topics cannot be replicated. Raise these on a real cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # INTERNAL: other containers (kafka:9092). EXTERNAL: tools running on the host (localhost:${KAFKA_PORT}).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:${KAFKA_PORT:?KAFKA_PORT must be set in env/.env.development},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.development
    restart: unless-stopped
    command: sh -c "pnpm --filter server prisma:generate && pnpm --filter server prisma:deploy && pnpm --filter server prisma:seed && pnpm --filter server dev"
    ports:
      - "${SERVER_PORT:?SERVER_PORT must be set in env/.env.development}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + process.env.SERVER_PORT + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    env_file:
      - ../env/.env.development
    environment:
      # Overrides env/.env.development for Docker networking.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
    volumes:
      - ../apps/server/src:/app/apps/server/src
      - ../apps/server/prisma:/app/apps/server/prisma
      # prisma client generated in-container stays off the host (no root-owned files)
      - /app/apps/server/src/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Outbox relay + Kafka consumers (notifications). Scale with `--scale worker=N`, up to KAFKA_PARTITIONS.
  worker:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.development
    restart: unless-stopped
    command: sh -c "pnpm --filter server prisma:generate && pnpm --filter server dev:worker"
    env_file:
      - ../env/.env.development
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - ../apps/server/src:/app/apps/server/src
      - /app/apps/server/src/generated
    depends_on:
      server:
        condition: service_healthy # migrations have run
      kafka:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/app/docker/Dockerfile.development
    restart: unless-stopped
    command: sh -c "pnpm --filter app dev"
    ports:
      - "${APP_PORT:?APP_PORT must be set in env/.env.development}:${APP_PORT}"
    env_file:
      - ../env/.env.development
    environment:
      # Vite proxies /api/v1 + /socket.io to the server container.
      - PROXY=true
      - VITE_SERVER_URL=http://server:${SERVER_PORT}
    volumes:
      - ../apps/app/src:/app/apps/app/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/query/src:/app/packages/query/src
      - ../packages/form/src:/app/packages/form/src
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/admin/docker/Dockerfile.development
    restart: unless-stopped
    command: sh -c "pnpm --filter admin dev"
    ports:
      - "${ADMIN_PORT:?ADMIN_PORT must be set in env/.env.development}:${ADMIN_PORT}"
    env_file:
      - ../env/.env.development
    environment:
      - PROXY=true
      - VITE_SERVER_URL=http://server:${SERVER_PORT}
    volumes:
      - ../apps/admin/src:/app/apps/admin/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/query/src:/app/packages/query/src
      - ../packages/form/src:/app/packages/form/src
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
