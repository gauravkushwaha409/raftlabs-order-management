# Production stack. Run via `pnpm docker:production:*` (passes --env-file env/.env.production).
# Build context is the repo root; paths are relative to this file (docker/).
# Vite bakes VITE_* into the web bundles at build time (env/.env.production).
name: raftlabs-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    environment:
      - PGPORT=${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:?REDIS_PORT must be set in env/.env.production}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker for small deployments. For production traffic point KAFKA_BROKERS at a
  # managed or multi-broker cluster and drop this service.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created by the worker at startup (partitions come from KAFKA_PARTITIONS).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Single broker: internal topics cannot be replicated. Raise these on a real cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?SERVER_PORT must be set in env/.env.production}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + process.env.SERVER_PORT + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - ../env/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Outbox relay + Kafka consumers (notifications). Scale with `--scale worker=N`, up to KAFKA_PARTITIONS.
  worker:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.production
    restart: unless-stopped
    command: ["node", "apps/server/dist/worker.js"]
    env_file:
      - ../env/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      server:
        condition: service_healthy # migrations have run
      kafka:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/app/docker/Dockerfile.production
      args:
        APP_ENV: production
    restart: unless-stopped
    environment:
      - APP_PORT=${APP_PORT:?APP_PORT must be set in env/.env.production}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/admin/docker/Dockerfile.production
      args:
        APP_ENV: production
    restart: unless-stopped
    environment:
      - ADMIN_PORT=${ADMIN_PORT:?ADMIN_PORT must be set in env/.env.production}
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  redis_data:
