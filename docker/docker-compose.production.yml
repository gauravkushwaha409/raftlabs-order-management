# Production stack. Run via `pnpm docker:production:*` (passes --env-file env/.env.production).
# Build context is the repo root; paths are relative to this file (docker/).
# Vite bakes VITE_* into the web bundles at build time (env/.env.production).
name: raftlabs-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    environment:
      - PGPORT=${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:?REDIS_PORT must be set in env/.env.production}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?SERVER_PORT must be set in env/.env.production}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + process.env.SERVER_PORT + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - ../env/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/app/docker/Dockerfile.production
      args:
        APP_ENV: production
    restart: unless-stopped
    environment:
      - APP_PORT=${APP_PORT:?APP_PORT must be set in env/.env.production}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/admin/docker/Dockerfile.production
      args:
        APP_ENV: production
    restart: unless-stopped
    environment:
      - ADMIN_PORT=${ADMIN_PORT:?ADMIN_PORT must be set in env/.env.production}
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
